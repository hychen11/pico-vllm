[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pico-vllm"
dynamic = ["version"]
description = "A small, test-driven vLLM-inspired inference engine for Qwen3 models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "hychen11" },
]
keywords = ["llm", "inference", "vllm", "paged-attention", "kv-cache", "qwen3"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.2.6",
  "torch>=2.2",
  "xxhash>=3.5",
]

[project.optional-dependencies]
model = [
  "transformers>=4.51",
  "safetensors>=0.4",
  "tokenizers>=0.20",
]
# M6 CUDA fast path. Linux CUDA torch wheels already ship Triton; this pins it explicitly.
cuda = [
  "triton>=3.0; sys_platform == 'linux'",
]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/hychen11/pico-vllm"
Repository = "https://github.com/hychen11/pico-vllm"
Issues = "https://github.com/hychen11/pico-vllm/issues"
Roadmap = "https://github.com/hychen11/pico-vllm/blob/main/ROADMAP.md"

[project.scripts]
pico-vllm = "pico_vllm.cli:main"

[tool.hatch.version]
path = "src/pico_vllm/__init__.py"

[tool.uv]
# The version is dynamic (read from __init__.py), so by default uv rebuilds the
# editable install on every `uv run`. Rebuild only when these files change.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/pico_vllm/__init__.py" }]

[tool.hatch.build.targets.wheel]
packages = ["src/pico_vllm"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "cuda: requires a CUDA device",
  "integration: exercises multiple pico_vllm components",
  "model: requires an explicitly provisioned local Qwen checkpoint",
  "benchmark: non-blocking performance test",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

# flash_attn ships no type hints, and CPU installs do not have it at all.
[[tool.mypy.overrides]]
module = ["flash_attn", "flash_attn.*"]
ignore_missing_imports = true
