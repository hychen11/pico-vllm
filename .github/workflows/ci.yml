name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      # CPU-only torch: tests never need CUDA, and the default Linux wheels pull
      # several GB of NVIDIA libraries.
      - name: Install dependencies
        run: |
          uv venv
          uv pip install --torch-backend cpu -e ".[dev,model]"

      - name: Lint
        run: uv run --no-sync ruff check src tests

      - name: Test
        run: uv run --no-sync pytest -q
